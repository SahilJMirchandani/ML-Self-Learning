name: ML Threshold Lab Tests

on:
  push:
    branches:
      - feature/ml-threshold-tuning-virtual-lab
    paths:
      - "ml-threshold-lab/**"
      - ".github/workflows/ml-threshold-lab-tests.yml"
  pull_request:
    paths:
      - "ml-threshold-lab/**"
      - ".github/workflows/ml-threshold-lab-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-threshold-lab/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ml-threshold-lab/requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s ml-threshold-lab/tests -v
